<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Matériel Hôtel NOVOTEL · IBIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with hotel switch + tab rail, then a single working pane (toolbar + content) */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface-2:#f6f8f7; --ink:#15211e; --muted:#5d6b67; --line:#d7dfdc;
  --accent:#0e5a53; --accent-ink:#ffffff; --brass:#a8711f;
  --novo:#22508f; --ibs:#b3332b;
  --ok:#2f7d4f; --warn:#b7791f; --crit:#c0392b;
  --ok-bg:#e3f1e8; --warn-bg:#fbf0dc; --crit-bg:#f9e2df;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 6px 20px rgba(20,40,35,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#162120; --surface-2:#1b2826; --ink:#e4ece9; --muted:#93a39e; --line:#2a3735;
  --accent:#4cb0a3; --accent-ink:#06201d; --brass:#d8a650;
  --novo:#7ea8e8; --ibs:#ee8077;
  --ok:#6cc690; --warn:#e2b158; --crit:#f08378;
  --ok-bg:#183126; --warn-bg:#33291a; --crit-bg:#3a1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --surface-2:#1b2826; --ink:#e4ece9; --muted:#93a39e; --line:#2a3735;
  --accent:#4cb0a3; --accent-ink:#06201d; --brass:#d8a650;
  --novo:#7ea8e8; --ibs:#ee8077;
  --ok:#6cc690; --warn:#e2b158; --crit:#f08378;
  --ok-bg:#183126; --warn-bg:#33291a; --crit-bg:#3a1f1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{text-transform:uppercase;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit;text-transform:inherit}
.u,.u *{text-transform:none!important}
.eyebrow,th,.brand small{letter-spacing:.06em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:20px;font-weight:700}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[data-h="NOVOTEL"][aria-pressed="true"]{color:var(--novo)}
.seg button[data-h="IBIS"][aria-pressed="true"]{color:var(--ibs)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 12px 11px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1 1 200px;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.toolbar select{width:auto}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.check{display:inline-flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer;user-select:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel h2 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span.sub{color:var(--muted);font-size:12px}
.kpi.alert b{color:var(--crit)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.hotel-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hcard{border-radius:10px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.hcard .hn{font-family:var(--f-display);font-weight:700;font-size:15px}
.hcard[data-h="NOVOTEL"] .hn{color:var(--novo)} .hcard[data-h="IBIS"] .hn{color:var(--ibs)}
.hcard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:13px}
.hcard dt{color:var(--muted)} .hcard dd{margin:0;text-align:right;font-family:var(--f-mono)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.barlist{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.barrow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.barrow .fill{height:100%;background:var(--accent);border-radius:3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0}
.card:hover{border-color:var(--muted);box-shadow:var(--shadow)}
.ph{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);max-width:100%;overflow:hidden;border-bottom:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:38%;opacity:.5}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .code{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.card .name{font-weight:600;line-height:1.3}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;padding-top:4px}
.card .qty{font-family:var(--f-mono);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.chip.h-NOVOTEL{color:var(--novo);border-color:color-mix(in srgb,var(--novo) 35%,var(--line))}
.chip.h-IBIS{color:var(--ibs);border-color:color-mix(in srgb,var(--ibs) 35%,var(--line))}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.in{background:var(--ok-bg);color:var(--ok)} .pill.out{background:var(--crit-bg);color:var(--crit)} .pill.tr{background:var(--surface-2);color:var(--novo);border:1px solid var(--line)} .pill.inv{background:var(--warn-bg);color:var(--warn)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;background:var(--surface-2);display:block;border:1px solid var(--line)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.artcell{display:flex;gap:10px;align-items:center;min-width:180px}
.zero{color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:32px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink);font-size:17px}
.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.settings{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0} .li .t b{font-weight:600;display:block} .li .t span{color:var(--muted);font-size:12px}
.swatch{width:14px;height:14px;border-radius:4px;flex:none;background:var(--c)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line);display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal header h2{font-size:18px}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal footer .left{margin-right:auto}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--crit);font-size:13px;font-weight:500}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick .ph{width:120px;flex:none;border:1px solid var(--line);border-radius:10px}
.detail{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:18px}
@media (max-width:640px){.detail{grid-template-columns:minmax(0,1fr)}}
.detail .ph{border:1px solid var(--line);border-radius:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(8,14,13,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(20px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px));cursor:zoom-out}
.lightbox img{max-width:min(92vw,1000px);max-height:80vh;object-fit:contain;background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox .cap{color:#fff;font-weight:600;text-align:center;max-width:90vw}
.lightbox .x{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:16px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;width:40px;height:40px;font-size:22px;cursor:pointer}
.zoomable{cursor:zoom-in}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.status{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.on i{background:var(--ok)} .status.off i{background:var(--crit)}
.dd{position:relative}
.dd>summary{list-style:none}.dd>summary::-webkit-details-marker{display:none}
.dd-panel{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:min(380px,calc(100vw - 32px));max-height:min(70vh,540px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:10px;display:flex;flex-direction:column;gap:8px}
.dd-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dd-row .grow{flex:1}
.dd-h{font-size:11px;letter-spacing:.08em;font-weight:700;margin:6px 4px 0}
.dep-opt{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:8px;cursor:pointer;font-size:13px}
.dep-opt:hover{background:var(--surface-2)}
.dep-opt input{width:16px;height:16px;accent-color:var(--accent);flex:none}
.dep-opt .n{margin-left:auto;font-family:var(--f-mono);color:var(--muted);font-size:12px}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-size:12px;font-weight:700;line-height:18px}
.depchips{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.depchips:empty{display:none}
.chip .x{border:0;background:none;cursor:pointer;padding:0 0 0 3px;color:inherit;font-size:14px;line-height:1}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface-2)}
.mode button{border:0;background:transparent;padding:4px 10px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
#toolbar{position:relative}
@media (max-width:640px){.dd{position:static}}
.barrow.click{cursor:pointer;border-radius:6px}.barrow.click:hover .lbl{color:var(--accent);text-decoration:underline}
.tr-res{border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;background:var(--surface)}
.tr-res:empty{display:none}
.tr-hit{display:flex;gap:10px;align-items:center;padding:8px 10px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none}
.tr-hit:last-child{border-bottom:0}.tr-hit:hover,.tr-hit:focus-visible{background:var(--surface-2)}
.tr-hit img,.tr-hit .noimg{width:48px;height:48px;border-radius:6px;object-fit:cover;flex:none;background:var(--surface-2);border:1px solid var(--line)}
.tr-hit .t{flex:1;min-width:0}.tr-hit .t b{display:block;font-weight:600}.tr-hit .t span{font-size:12px;color:var(--muted)}
.tr-hit .q{font-family:var(--f-mono);font-size:12.5px;text-align:right;white-space:nowrap}
.tr-hit[disabled]{opacity:.55;cursor:default}
.tr-line{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
@media (max-width:560px){.tr-line{grid-template-columns:minmax(0,1fr)}.tr-line .ph{width:min(180px,100%)}}
.tr-line .ph{border-radius:10px;border:1px solid var(--line);background:var(--surface);aspect-ratio:1}
.tr-line .ph img{object-fit:contain;background:#fff}
.srcs{display:flex;flex-direction:column;gap:6px}
.src{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:13px}
.src input{accent-color:var(--accent);flex:none}
.src.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.src .q{margin-left:auto;font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.src.dis{opacity:.5;cursor:not-allowed}
.trno{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
.modal.xl{max-width:1200px}
.trh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.trx-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:860px){.trx-top{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.trx-top{grid-template-columns:minmax(0,1fr)}}
.trx-cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.trx-cols{grid-template-columns:minmax(0,1fr)}}
.trx-cat,.trx-cart{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);min-width:0;display:flex;flex-direction:column;gap:10px}
.trx-h{display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;flex:none}
.trx-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.trx-filters input[type=search]{flex:1 1 200px;width:auto}.trx-filters select{flex:0 1 190px;width:auto}
.trx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;max-height:min(58vh,620px);overflow:auto;padding:2px;align-content:start}
.tcard{position:relative;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px;text-align:left;cursor:pointer;min-width:0}
.tcard:hover{border-color:var(--accent)}
.tcard .im{aspect-ratio:1;border-radius:7px;background:#fff;display:grid;place-items:center;overflow:hidden;color:#9aa}
.tcard .im img{width:100%;height:100%;object-fit:contain}.tcard .im svg{width:40%}

window.FB={rdb,auth,ref,get,set,update,remove,onValue,ekey,clean,photoCache,getPhoto,role:()=>role,dept:()=>dept,me:()=>me,parseAcc,signOut:()=>signOut(auth)};
$("#login-btn").onclick=async()=>{$("#login-err").textContent="";const pr=new GoogleAuthProvider();pr.setCustomParameters({prompt:"select_account"});
  try{await signInWithPopup(auth,pr)}catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")await signInWithRedirect(auth,pr);else $("#login-err").textContent="Connexion impossible : "+(e.message||e.code)}};
const LK="mh-email-link",okMail=e=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
let pendingLink=false;
const finishLink=async em=>{await signInWithEmailLink(auth,em,location.href);try{localStorage.removeItem(LK)}catch(e){}history.replaceState(null,"",location.pathname)};
$("#lk-form").onsubmit=async ev=>{ev.preventDefault();const em=$("#lk-mail").value.trim().toLowerCase(),btn=$("#lk-btn"),er=$("#login-err"),ok=$("#login-ok");er.textContent="";ok.textContent="";
  if(!okMail(em)){er.textContent="Adresse e-mail invalide.";return}
  const old=btn.textContent;btn.disabled=true;btn.textContent="Vérification…";
  try{
    if(pendingLink){await finishLink(em);return}
    if(em!==window.OWNER_EMAIL){let ex=false;try{ex=(await get(ref(rdb,"comptes/"+ekey(em)))).exists()}catch(e){ex=false}
      if(!ex){er.textContent="Aucun compte pour cette adresse. Demandez à l'administrateur de vous créer un accès.";return}}
    await sendSignInLinkToEmail(auth,em,{url:location.origin+location.pathname,handleCodeInApp:true});
    try{localStorage.setItem(LK,em)}catch(e){}
    ok.innerHTML=`Lien de connexion envoyé à <b>${em.replace(/</g,"&lt;")}</b>.<br>Ouvrez cet e-mail (regardez aussi dans les spams) et cliquez sur le lien, de préférence sur cet appareil.`;
  }catch(x){const c=x&&x.code||"";er.textContent=c==="auth/quota-exceeded"?"Limite d'e-mails de connexion atteinte pour aujourd'hui. Réessayez demain ou connectez-vous avec Google.":c==="auth/invalid-action-code"||c==="auth/expired-action-code"?"Ce lien a expiré ou a déjà été utilisé : demandez-en un nouveau.":c==="auth/invalid-email"?"L'adresse ne correspond pas à celle qui a reçu le lien.":"Connexion impossible : "+((x&&x.message)||c)}
  finally{btn.disabled=false;btn.textContent=old}};
if(isSignInWithEmailLink(auth,location.href)){let em=null;try{em=localStorage.getItem(LK)}catch(e){}
  if(em)finishLink(em).catch(x=>{history.replaceState(null,"",location.pathname);$("#login").hidden=false;$("#login-err").textContent="Ce lien a expiré ou a déjà été utilisé : demandez-en un nouveau."});
  else{pendingLink=true;$("#login-msg").textContent="Pour terminer la connexion, confirmez l'adresse e-mail qui a reçu le lien.";$("#lk-btn").textContent="Se connecter";$("#lk-or").hidden=true;$("#login-btn").hidden=true}}
let started=false;
onAuthStateChanged(auth,async u=>{
  if(!u){$("#login").hidden=false;return}
  me=u;
  const em=String(u.email||"").toLowerCase();
  try{const s=await get(ref(rdb,"acces/"+ekey(em)));acc=parseAcc(s.val())}catch(e){acc=null}
  role=em===window.OWNER_EMAIL?"admin":(acc&&acc.role)||null;dept=(acc&&acc.dept)||"";
  if(role)try{await set(ref(rdb,"users/"+u.uid),{name:(acc&&acc.nom)||u.displayName||u.email,email:em,dept,vu:Date.now()})}catch(e){}
  if(!role){$("#login").hidden=false;$("#login-main").hidden=true;$("#login-ok").textContent="";$("#login-msg").innerHTML=`Le compte <b>${u.email}</b> n'a pas d'accès.<br>Demandez à l'administrateur de vous créer un accès, puis reconnectez-vous.<br><br><button type="button" id="login-sw">Changer de compte</button>`;$("#login-sw").onclick=()=>signOut(auth).then(()=>location.reload());return}
  $("#login").hidden=true;
  const ac=document.getElementById("acct");if(ac)ac.innerHTML=`<span title="${u.email}">${String((acc&&acc.nom)||u.displayName||u.email).split(" ")[0]}${dept?" · "+dept:""} · ${({admin:"Administrateur",contrib:"Contributeur",viewer:"Lecture"})[role]||role}</span>${role==="admin"?'<button id="acct-acc" type="button">Comptes</button>':""}<button id="acct-out" type="button">Déconnexion</button>`;
  const o=document.getElementById("acct-out");if(o)o.onclick=()=>signOut(auth).then(()=>location.reload());
  const a=document.getElementById("acct-acc");if(a)a.onclick=()=>window.accessPanel&&window.accessPanel();
  if(!started){started=true;window.__fbReady({db:dbApi,user:userApi,assets:(role==='admin'||role==='contrib')?assetsApi:null,downloads:null})}
});
</script>

<div id="modal-root"></div>

<script>
const HOTELS=["NOVOTEL","IBIS"];
const GROUP_COLORS=["#0e5a53","#22508f","#b3332b","#a8711f","#6b4fa0","#2f7d4f","#c25e8a","#4f6d7a","#8a6d3b","#1f8a99"];
const S={groupes:[],unites:[],depots:[],articles:[],stock:[],mouvements:[],transferts:[]};
const loaded={};
let db=null,user=null,assets=null,canWrite=true,myId=null;
const names={};
let ui={hotel:"ALL",tab:"dash",q:"",groupe:"",alert:false,view:"cards",mvType:"",mvQ:"",deps:[],depMode:"any",trQ:"",trSt:"",dcQ:"",dcSt:""};
try{Object.assign(ui,JSON.parse(localStorage.getItem("mh-ui")||"{}"))}catch(e){}
if(ui.hotel==="IBS")ui.hotel="IBIS";
if(ui.tab==="stock"){ui.tab="articles";ui.view="table"}
if(!Array.isArray(ui.deps))ui.deps=[];if(ui.depMode!=="all")ui.depMode="any";
function saveUi(){try{localStorage.setItem("mh-ui",JSON.stringify(ui))}catch(e){}}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uS=x=>`<span class="u">${esc(x)}</span>`;
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString("fr-FR");
const money=n=>Math.round(+n||0).toLocaleString("fr-FR")+" Ar";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fdate=s=>{if(!s)return"";const[y,m,d]=s.split("-");return d+"/"+m+"/"+y};
const by=(arr)=>Object.fromEntries(arr.map(x=>[x.id,x]));
const PH_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>';

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- derived data ---------- */
function G(){return by(S.groupes)} function U(){return by(S.unites)} function D(){return by(S.depots)} function A(){return by(S.articles)}
const depKey=d=>(d.hotel==="LES2"?"0":d.hotel)+d.nom;
function depotsVis(){return S.depots.filter(d=>ui.hotel==="ALL"||d.hotel===ui.hotel||d.hotel==="LES2").sort((a,b)=>depKey(a).localeCompare(depKey(b)))}
function artVis(){return S.articles.filter(a=>ui.hotel==="ALL"||!a.hotel||a.hotel==="LES2"||a.hotel===ui.hotel)}
let stockMap={};
function rebuildStock(){stockMap={};for(const s of S.stock)stockMap[s.articleId+"__"+s.depotId]=+s.qte||0}
const qty=(a,d)=>stockMap[a+"__"+d]||0;
function total(aid,deps=depotsVis()){let t=0;for(const d of deps)t+=qty(aid,d.id);return t}
const inDep=(a,did)=>qty(a.id,did)!==0||a.depotDefaut===did;
function selDeps(){const vis=new Set(depotsVis().map(d=>d.id));return ui.deps.filter(id=>vis.has(id))}
function qtyCtx(aid){const s=selDeps();return s.length?total(aid,s.map(id=>({id}))):total(aid)}
function level(a,t){const s=+a.seuil||0;if(t<=0&&s>0)return"crit";if(s>0&&t<=s)return"warn";if(t<=0)return"crit";return"ok"}
const LEVEL_TXT={ok:"En stock",warn:"Stock bas",crit:"Rupture"};
const PH_PIX="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==";
function photoSrc(a){if(!a||!a.photo)return null;if(a.photo.asset){const c=window.FB&&window.FB.photoCache.get(a.photo.asset);return c||PH_PIX+"#pid="+a.photo.asset}return a.photo.data||null}
function groupColor(g){if(!g)return"var(--muted)";return g.couleur||GROUP_COLORS[0]}
function nextCode(){let m=0;for(const a of S.articles){const r=/^ART-(\d+)$/.exec(a.code||"");if(r)m=Math.max(m,+r[1])}return"ART-"+String(m+1).padStart(4,"0")}

/* ---------- capabilities ---------- */
(async()=>{
  const cl=window.claude;
  if(!cl||!cl.use){setConn(false,"Base de données indisponible");renderAll();return}
  setConn(false,"Connexion…");
  db=await cl.use("db");
  user=await cl.use("user");
  assets=await cl.use("assets");
  if(!db){setConn(false,"Base de données indisponible");renderAll();return}
  try{myId=user?await user.id():null}catch(e){}
  try{const c=user?await user.can("data.write"):null;if(c===false)canWrite=false}catch(e){}
  $("#ro").hidden=canWrite;
  setConn(true,"Synchronisé");
  const sub=(name,q)=>q.onSnapshot(snap=>{S[name]=snap.docs.map(d=>{const o={id:d.id,...d.data()};if(o.hotel==="IBS")o.hotel="IBIS";return o});loaded[name]=true;if(name==="stock")rebuildStock();scheduleRender()},e=>{setConn(false,"Hors ligne ("+e.code+")")});
  sub("groupes",db.collection("groupes"));
  sub("unites",db.collection("unites"));
  sub("depots",db.collection("depots"));
  sub("articles",db.collection("articles"));
  sub("stock",db.collection("stock"));
  sub("mouvements",db.collection("mouvements").orderBy("ts","desc").limit(1000));
  sub("transferts",db.collection("transferts"));
})();
function setConn(ok,txt){const c=$("#conn");c.className="status "+(ok?"on":"off");c.querySelector("span").textContent=txt}
let rq=0;function scheduleRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;renderBody()})}

async function resolveNames(ids){
  ids=[...new Set(ids.filter(i=>i&&!(i in names)))];if(!ids.length||!user)return;
  for(const i of ids)names[i]="";
  try{const ps=await user.profiles(ids);for(const i of ids)names[i]=(ps&&ps[i]&&ps[i].name)||""}catch(e){}
  scheduleRender();
}

/* ---------- header controls ---------- */
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ui.hotel=b.dataset.h;saveUi();syncHeader();renderAll()});
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;saveUi();syncHeader();renderAll()});
function syncHeader(){
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.h===ui.hotel));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===ui.tab));
}
function renderAll(){renderToolbar();renderBody()}

/* ---------- toolbar per tab ---------- */
function usedGroups(){const u=new Set(artVis().map(a=>a.groupeId));return S.groupes.filter(g=>u.has(g.id))}
function filterGroupOptions(sel){return`<option value="">Tous les groupes</option>`+usedGroups().sort((a,b)=>a.nom.localeCompare(b.nom)).map(g=>`<option value="${g.id}" ${g.id===sel?"selected":""}>${esc(g.nom)}</option>`).join("")}
function groupOptions(sel,allLabel){return(allLabel!==undefined?`<option value="">${allLabel}</option>`:"")+S.groupes.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).map(g=>`<option value="${g.id}" ${g.id===sel?"selected":""}>${esc(g.nom)}</option>`).join("")}
function renderToolbar(){
  const tb=$("#toolbar");const w=canWrite;
  if(ui.tab==="dash"){tb.innerHTML=w?`<div class="grow"></div><button class="btn" id="tb-art">+ Article</button><button class="btn" id="tb-mv">+ Mouvement</button><button class="btn primary" id="tb-tr">⇄ Transfert</button>`:"";}
  else if(ui.tab==="articles"){
    tb.innerHTML=`<input type="search" id="tb-q" class="grow" placeholder="Rechercher un article, un code…" value="${esc(ui.q)}">
      <select id="tb-g" aria-label="Groupe">${filterGroupOptions(ui.groupe)}</select>
      <details class="dd" id="dd-dep"><summary class="btn" aria-label="Filtrer par dépôt">Dépôts <span class="badge" id="dep-badge" hidden></span> <span aria-hidden="true">▾</span></summary><div class="dd-panel" id="dep-panel"></div></details>
      <label class="check"><input type="checkbox" id="tb-al" ${ui.alert?"checked":""}> Alertes seulement</label>
      ${ui.tab==="articles"?`<div class="seg" role="group" aria-label="Affichage"><button data-v="cards" aria-pressed="${ui.view==="cards"}">Fiches</button><button data-v="table" aria-pressed="${ui.view==="table"}">Liste</button></div>`:""}
      ${w?`<button class="btn primary" id="tb-art">+ Article</button>`:""}
      <div class="depchips" id="depchips"></div>`;
  } else if(ui.tab==="mvts"){
    tb.innerHTML=`<input type="search" id="tb-mq" class="grow" placeholder="Rechercher article, dépôt, note, N° de transfert…" value="${esc(ui.mvQ)}">
      <select id="tb-mt" aria-label="Type"><option value="">Tous les types</option>${Object.entries(MV).map(([k,v])=>`<option value="${k}" ${ui.mvType===k?"selected":""}>${v.label}</option>`).join("")}</select>
      ${w?`<button class="btn" id="tb-mv">+ Mouvement</button><button class="btn primary" id="tb-tr">⇄ Transfert</button>`:""}`;
  } else if(ui.tab==="trs"){
    tb.innerHTML=`<input type="search" id="tb-tq" class="grow" placeholder="Rechercher N°, article, dépôt, motif…" value="${esc(ui.trQ)}">
      <div class="seg" role="group" aria-label="Statut">${[["","Tous"],["brouillon","Brouillons"],["valide","Validés"]].map(([k,l])=>`<button data-st="${k}" aria-pressed="${ui.trSt===k}">${l}</button>`).join("")}</div>
      ${w?`<button class="btn primary" id="tb-tr">⇄ Nouveau transfert</button>`:""}`;
  } else if(ui.tab==="decl"){
    tb.innerHTML=`<input type="search" id="tb-dq" class="grow" placeholder="Rechercher N°, article, dépôt…" value="${esc(ui.dcQ)}">
      <div class="seg" role="group" aria-label="Statut">${[["","Tous"],["brouillon","Brouillons"],["valide","Validés"]].map(([k,l])=>`<button data-dst="${k}" aria-pressed="${ui.dcSt===k}">${l}</button>`).join("")}</div>
      ${w?`<button class="btn primary" id="tb-dc">+ Nouvelle déclaration</button>`:""}`;
  } else tb.innerHTML="";
  const on=(id,ev,fn)=>{const el=$("#"+id);if(el)el.addEventListener(ev,fn)};
  on("tb-art","click",()=>articleForm());
  on("tb-mv","click",()=>moveForm());
  on("tb-tr","click",()=>transferForm());
  on("tb-q","input",e=>{ui.q=e.target.value;artLimit=120;saveUi();renderBody()});
  on("tb-g","change",e=>{ui.groupe=e.target.value;saveUi();renderBody()});
  on("tb-al","change",e=>{ui.alert=e.target.checked;saveUi();renderBody()});
  on("tb-mq","input",e=>{ui.mvQ=e.target.value;renderBody()});
  on("tb-tq","input",e=>{ui.trQ=e.target.value;renderBody()});
  on("tb-dq","input",e=>{ui.dcQ=e.target.value;renderBody()});
  on("tb-dc","click",()=>transferEditor(null,{decl:true}));
  tb.querySelectorAll("[data-dst]").forEach(b=>b.onclick=()=>{ui.dcSt=b.dataset.dst;saveUi();renderToolbar();renderBody()});
  tb.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ui.trSt=b.dataset.st;saveUi();renderToolbar();renderBody()});
  on("tb-mt","change",e=>{ui.mvType=e.target.value;saveUi();renderBody()});
  tb.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ui.view=b.dataset.v;saveUi();renderToolbar();renderBody()});
  const dd=$("#dd-dep");if(dd)dd.addEventListener("toggle",()=>{if(dd.open)buildDepPanel()});
  updDepUI();
}
/* ---------- depot multi-filter ---------- */
function setDeps(ids){ui.deps=[...new Set(ids)];artLimit=120;saveUi();updDepUI();renderBody()}
function updDepUI(){
  const s=selDeps(),dm=D();const bd=$("#dep-badge");if(bd){bd.hidden=!s.length;bd.textContent=s.length}
  const c=$("#depchips");if(!c)return;
  if(!s.length){c.innerHTML="";return}
  if(s.length>1&&s.length===depotsVis().length){c.innerHTML=`<span class="hint">Dépôts :</span><span class="chip">TOUS LES DÉPÔTS (${s.length})<button class="x" id="dep-x" aria-label="Retirer">×</button></span>`;$("#dep-x",c).onclick=()=>setDeps([]);return}
  c.innerHTML=`<span class="hint">${s.length>1?(ui.depMode==="all"?"Présents dans tous ces dépôts :":"Présents dans au moins un de ces dépôts :"):"Dépôt :"}</span>`+s.map(id=>{const d=dm[id];return`<span class="chip ${d&&d.hotel!=="LES2"?"h-"+d.hotel:""}">${esc(d?.nom||id)}<button class="x" data-rm="${id}" aria-label="Retirer ${esc(d?.nom||"")}">×</button></span>`}).join("")+`<button class="btn ghost sm" id="dep-clear">Effacer</button>`;
  c.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>setDeps(ui.deps.filter(x=>x!==b.dataset.rm)));
  $("#dep-clear",c).onclick=()=>setDeps([]);
}
function buildDepPanel(){
  const p=$("#dep-panel");if(!p)return;
  const deps=depotsVis(),arts=artVis(),cnt={};
  for(const d of deps){let n=0;for(const a of arts)if(inDep(a,d.id))n++;cnt[d.id]=n}
  const grp=[["LES2","Commun aux deux hôtels"],["NOVOTEL","NOVOTEL"],["IBIS","IBIS"]];
  const fq=(p.dataset.q||"").toLowerCase();
  p.innerHTML=`<input type="search" id="dep-q" placeholder="Chercher un dépôt…" value="${esc(p.dataset.q||"")}">
    <div class="dd-row"><span class="hint">Article présent dans</span><span class="mode" role="group" aria-label="Mode"><button data-m="any" aria-pressed="${ui.depMode==="any"}">au moins un</button><button data-m="all" aria-pressed="${ui.depMode==="all"}">tous</button></span><span class="grow"></span><button class="btn ghost sm" id="dep-none">Aucun</button></div>
    <div id="dep-list"><label class="dep-opt dep-all"><input type="checkbox" id="dep-all" ${deps.length&&deps.every(d=>ui.deps.includes(d.id))?"checked":""}><span><b>TOUS LES DÉPÔTS</b></span><span class="n">${deps.length}</span></label>${grp.map(([h,lbl])=>{const ds=deps.filter(d=>d.hotel===h&&(!fq||d.nom.toLowerCase().includes(fq)));if(!ds.length)return"";const allH=ds.every(d=>ui.deps.includes(d.id));return`<label class="dd-h dep-grp" style="color:var(--${h==="IBIS"?"ibs":h==="LES2"?"accent":"novo"})"><input type="checkbox" data-grp="${h}" ${allH?"checked":""}> ${h==="LES2"?lbl:"TOUS "+lbl}</label>`+ds.map(d=>`<label class="dep-opt"><input type="checkbox" value="${d.id}" ${ui.deps.includes(d.id)?"checked":""}><span>${esc(d.nom)}</span><span class="n" title="Articles présents">${cnt[d.id]}</span></label>`).join("")}).join("")||`<p class="hint">Aucun dépôt trouvé.</p>`}</div>`;
  const q=$("#dep-q",p);q.oninput=()=>{p.dataset.q=q.value;const pos=q.selectionStart;buildDepPanel();const nq=$("#dep-q",p);nq.focus();try{nq.setSelectionRange(pos,pos)}catch(e){}};
  p.querySelectorAll("#dep-list input[type=checkbox][value]").forEach(cb=>cb.onchange=()=>{setDeps(cb.checked?[...ui.deps,cb.value]:ui.deps.filter(x=>x!==cb.value));buildDepPanel()});
  $("#dep-all",p).onchange=e=>{setDeps(e.target.checked?deps.map(d=>d.id):[]);buildDepPanel()};
  p.querySelectorAll("[data-grp]").forEach(cb=>cb.onchange=()=>{const ids=deps.filter(d=>d.hotel===cb.dataset.grp&&(!fq||d.nom.toLowerCase().includes(fq))).map(d=>d.id);setDeps(cb.checked?[...ui.deps,...ids]:ui.deps.filter(x=>!ids.includes(x)));buildDepPanel()});
  p.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ui.depMode=b.dataset.m;p.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",x===b));saveUi();updDepUI();renderBody()});
  $("#dep-none",p).onclick=()=>{setDeps([]);buildDepPanel()};
}
document.addEventListener("click",e=>{const d=$("#dd-dep");if(d&&d.open&&!d.contains(e.target))d.open=false});
document.addEventListener("keydown",e=>{const d=$("#dd-dep");if(e.key==="Escape"&&d&&d.open){d.open=false;d.querySelector("summary").focus()}});

function renderBody(){
  const b=$("#body");

/* ---------- filtering ---------- */
function filteredArticles(){
  const q=ui.q.trim().toLowerCase();const g=G();const sd0=selDeps();const sd=sd0.length===depotsVis().length?[]:sd0;
  return artVis().filter(a=>{
    if(ui.groupe&&a.groupeId!==ui.groupe)return false;
    if(sd.length&&!(ui.depMode==="all"?sd.every(d=>inDep(a,d)):sd.some(d=>inDep(a,d))))return false;
    if(q&&!((a.nom||"")+" "+(a.code||"")+" "+(g[a.groupeId]?.nom||"")+" "+(a.description||"")).toLowerCase().includes(q))return false;
    if(ui.alert&&level(a,qtyCtx(a.id))==="ok")return false;
    return true;
  }).sort((a,b)=>(a.nom||"").localeCompare(b.nom||""));
}

  // weekly series (12 weeks)

  const inW=new Array(W).fill(0),outW=new Array(W).fill(0),deltaAfter=new Array(W).fill(0);

        <div class="kpi ${alerts.length?"alert":""}"><span class="eyebrow">Alertes</span><b>${alerts.length}</b><span class="sub">${alerts.filter(a=>a[2]==="crit").length} en rupture · ${mv30.length} mouvements sur 30 j</span></div>

function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function axis(W,H,L,T,B,max,ticks=4){let s="";for(let i=0;i<=ticks;i++){const v=max*i/ticks,y=T+(H-T-B)*(1-i/ticks);s+=`<line x1="${L}" x2="${W-8}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmt(v)}</text>`}return s}
function xLabels(labels,x,H,B){return labels.map((l,i)=>i%2===(labels.length-1)%2?`<text x="${x(i)}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${l}</text>`:"").join("")}
function barsSvg(labels,a,b){
  const W=640,H=230,L=48,T=10,B=26;const max=niceMax(Math.max(...a,...b));const n=labels.length;const slot=(W-8-L)/n;const bw=Math.min(16,slot/2-3);
  const y=v=>T+(H-T-B)*(1-v/max);const x=i=>L+slot*i+slot/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entrées et sorties par semaine">${axis(W,H,L,T,B,max)}`;
  for(let i=0;i<n;i++){if(a[i])s+=`<rect x="${x(i)-bw-1}" y="${y(a[i])}" width="${bw}" height="${H-B-y(a[i])}" rx="2" fill="var(--ok)"><title>${labels[i]} — entrées ${fmt(a[i])}</title></rect>`;if(b[i])s+=`<rect x="${x(i)+1}" y="${y(b[i])}" width="${bw}" height="${H-B-y(b[i])}" rx="2" fill="var(--crit)"><title>${labels[i]} — sorties ${fmt(b[i])}</title></rect>`}
  return s+xLabels(labels,x,H,B)+`</svg>`;
}
function lineSvg(labels,v){
  const W=640,H=230,L=48,T=10,B=26;const max=niceMax(Math.max(...v,0));const n=labels.length;const x=i=>L+(W-8-L)*(n===1?0.5:i/(n-1));const y=val=>T+(H-T-B)*(1-Math.max(0,val)/max);
  const pts=v.map((val,i)=>`${x(i)},${y(val)}`).join(" ");
  const area=`M${x(0)},${H-B} L${pts.replace(/ /g," L")} L${x(n-1)},${H-B} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du stock total">${axis(W,H,L,T,B,max)}<path d="${area}" fill="var(--accent)" opacity=".14"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>${v.map((val,i)=>`<circle cx="${x(i)}" cy="${y(val)}" r="${i===n-1?4.5:2.5}" fill="${i===n-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="1.6"><title>${labels[i]} — ${fmt(val)}</title></circle>`).join("")}<text x="${x(n-1)-6}" y="${y(v[n-1])-10}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${fmt(v[n-1])}</text>${xLabels(labels,x,H,B)}</svg>`;
}

/* ---------- Modal helpers ---------- */
function openModal(html,{wide=false}={}){
  const root=$("#modal-root");root.innerHTML=`<div class="overlay"><div class="modal ${wide==="xl"?"wide xl":wide?"wide":""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov=root.firstChild;ov.addEventListener("mousedown",e=>{if(e.target===ov)closeModal()});
  root.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  const f=root.querySelector("input,select,textarea");if(f)setTimeout(()=>f.focus(),30);
  return root.querySelector(".modal");
}
function openPhoto(src,cap){if(src&&src.includes("#pid=")&&window.FB){window.FB.getPhoto(src.split("#pid=")[1]).then(d=>{if(d)openPhoto(d,cap)});return}closePhoto();const d=document.createElement("div");d.className="lightbox";d.id="lightbox";d.setAttribute("role","dialog");d.innerHTML=`<button class="x" aria-label="Fermer">×</button><img alt=""><div class="cap"></div>`;d.querySelector("img").src=src;d.querySelector(".cap").textContent=cap||"";d.onclick=closePhoto;document.body.appendChild(d)}
function closePhoto(){const l=document.getElementById("lightbox");if(l){l.remove();return true}return false}
document.addEventListener("click",e=>{const z=e.target.closest("[data-zoom]");if(z){e.preventDefault();e.stopPropagation();openPhoto(z.dataset.zoom,z.dataset.cap)}},true);
function closeModal(){$("#modal-root").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!closePhoto())closeModal()}});
function confirmInline(btn,label,fn){if(btn.dataset.armed){fn();return}btn.dataset.armed="1";const old=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old}},3500)}
async function guard(m,fn){const err=m.querySelector(".err");const btns=m.querySelectorAll("footer .btn");btns.forEach(b=>b.disabled=true);try{await fn()}catch(e){if(err)err.textContent=errText(e);btns.forEach(b=>b.disabled=false);return}}
function errText(e){const c=e&&e.code;if(c==="invalid_argument")return"Enregistrement refusé : vous n'avez peut-être pas le droit de modifier.";if(c==="quota_exceeded")return"La base est pleine : supprimez d'anciens éléments.";if(c==="too_large")return"Photo trop lourde (20 Mo max).";return(e&&e.message)||"Échec de l'enregistrement. Réessayez."}

/* ---------- Photo handling ---------- */
function loadImg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej({message:"Image illisible."});i.src=r.result};r.onerror=()=>rej({message:"Fichier illisible."});r.readAsDataURL(file)})}
function shrink(img,max,qual){const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c}
async function preparePhoto(file){
  const img=await loadImg(file);
  if(assets){const c=shrink(img,640,.8);const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.84));const up=await assets.upload(blob,{type:"image/jpeg"});return{asset:up.id}}
  // fallback for viewers without asset upload: small inline image stored in the record
  let q=.72,c=shrink(img,520,q),d=c.toDataURL("image/jpeg",q);
  while(d.length>140000&&q>.35){q-=.1;d=c.toDataURL("image/jpeg",q)}
  return{data:d};
}

function stepSvg(pts){

  const p=pts.map(q=>`${x(q[0]).toFixed(1)},${y(q[1]).toFixed(1)}`).join(" ");
  const lab=t=>{const d=new Date(t);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getFullYear()).slice(2)};
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du stock de l'article">${axis(W,H,L,T,B,max,3)}<polyline points="${p}" fill="none" stroke="var(--accent)" stroke-width="2"/><text x="${L}" y="${H-B+16}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${lab(t0)}</text><text x="${W-8}" y="${H-B+16}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">Aujourd'hui</text></svg>`;
}

function transferEditor(t=null,pre={}){
  if(!canWrite){toast("Lecture seule : vous ne pouvez pas créer de transfert.");return}
  if(S.depots.length<2){toast("Il faut au moins deux dépôts.");return}
  const g=G(),u=U(),dm=D();
  const decl=!!(pre.decl||isDecl(t));let nature=t?.nature||"";
  let id=t?.id||null,numero=t?.numero||null,dest=t?.destId||"",from=pre.from||"",onlyStock=true,limit=48,grp="",ttype=decl?"permanent":(t?.type||"");
  const perteDeps=sortedDeps().filter(isPerte);if(decl&&!dest){const pd=perteDeps.find(d=>ui.hotel!=="ALL"&&d.hotel===ui.hotel);if(pd)dest=pd.id;else if(perteDeps.length===1)dest=perteDeps[0].id}
  /* un article = une ligne ; sa quantité peut venir de plusieurs dépôts (alloc) */
  const items=[];
  for(const l of (t?.lignes||[])){let it=items.find(x=>x.aid===l.articleId);if(!it){it={aid:l.articleId,alloc:{},tot:0};items.push(it)}if(l.srcId&&+l.qte>0){it.alloc[l.srcId]=(it.alloc[l.srcId]||0)+(+l.qte)}it.tot+=(+l.qte||0)}
  const srcOpts=aid=>availDeps(aid).filter(([d])=>d.id!==dest);
  const order=aid=>{const av=srcOpts(aid);const f=av.find(([d])=>d.id===from);return f?[f,...av.filter(x=>x!==f)]:av};
  const dispo=aid=>srcOpts(aid).reduce((s,x)=>s+x[1],0);

async function recordMove(mv,extraArts={}){

  if(mv.type==="entree")effets.push({depotId:mv.depotId,delta:mv.qte});
  if(mv.type==="sortie")effets.push({depotId:mv.depotId,delta:-mv.qte});

}
